{% extends "base.html" %}

{% block title %}Tags — {{ config.title }}{% endblock %}

{% block body %}
<div class="page-head">
  <h1 class="page-title">Tags</h1>
  <p class="page-intro">Browse by subject. Each tag links to the entries that share it.</p>
</div>
<div class="divider">&#10087;&nbsp;&#9753;</div>

<div class="tag-cloud">
  {% for term in terms %}
    <a href="{{ term.permalink | safe }}">#{{ term.name }}<span class="n">{{ term.pages | length }}</span></a>
  {% endfor %}
</div>
{% endblock %}
